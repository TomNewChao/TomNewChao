name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate overview.svg
        uses: jstrieb/github-stats@master
        with:
          username: TomNewChao
          template: overview
          token: ${{ secrets.GITHUB_TOKEN }}
          output: overview.svg

      - name: Generate languages.svg
        uses: jstrieb/github-stats@master
        with:
          username: TomNewChao
          template: languages
          token: ${{ secrets.GITHUB_TOKEN }}
          output: languages.svg

      - name: Push to stats branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan stats
          git reset --hard
          cp "$GITHUB_WORKSPACE/overview.svg" overview.svg
          cp "$GITHUB_WORKSPACE/languages.svg" languages.svg
          git add overview.svg languages.svg
          git commit -m "chore: update stats SVGs [skip ci]" || exit 0
          git push -f origin stats
