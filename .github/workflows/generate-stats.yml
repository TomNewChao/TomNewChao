name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone github-stats
        run: git clone https://github.com/jstrieb/github-stats.git

      - name: Install dependencies
        run: pip install -r github-stats/requirements.txt

      - name: Generate overview.svg
        run: |
          python github-stats/generate.py \
            --username TomNewChao \
            --template overview \
            --output overview.svg \
            --token ${{ secrets.GITHUB_TOKEN }}

      - name: Generate languages.svg
        run: |
          python github-stats/generate.py \
            --username TomNewChao \
            --template languages \
            --output languages.svg \
            --token ${{ secrets.GITHUB_TOKEN }}

      - name: Push to stats branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan stats
          git rm -rf . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/overview.svg" overview.svg
          cp "$GITHUB_WORKSPACE/languages.svg" languages.svg
          git add overview.svg languages.svg
          git commit -m "chore: update stats SVGs [skip ci]" || exit 0
          git push -f origin stats
